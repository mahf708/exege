name: release

# A tag `vX.Y.Z` on main publishes exege-core X.Y.Z and exege X.Y.Z (the full install,
# packages/exege) to PyPI. "Run workflow" publishes
# whatever ref it is given to TestPyPI instead: the dress rehearsal.
#
# Neither needs a token. Both indexes trust this workflow by name (PyPI's "trusted
# publishing"), so the project's publisher settings there must name this repository,
# `release.yml`, and the environment of the job that uploads.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
          show-progress: false
      - uses: astral-sh/setup-uv@v5
      - name: Build
        run: uv build --all-packages
      # A tag that disagrees with `__version__` would publish one number under the
      # name of another, and an index never lets a version be replaced.
      - name: The tag is the version
        if: github.ref_type == 'tag'
        run: |
          for wheel in exege_core exege; do
            wheel="dist/$wheel-${GITHUB_REF_NAME#v}-py3-none-any.whl"
            test -f "$wheel" || { echo "::error::tag $GITHUB_REF_NAME, but built: $(ls dist)"; exit 1; }
          done
      - name: Check the metadata
        run: uvx twine check --strict dist/*
      # What is uploaded is the wheels, so they are what is tried. exege-core installed
      # alone must start, and must not have brought the scientific stack with it.
      - name: Try the exege-core wheel on its own
        run: |
          uv venv /tmp/wheel
          uv pip install --python /tmp/wheel/bin/python dist/exege_core-*.whl
          /tmp/wheel/bin/exege --version
          /tmp/wheel/bin/exege --help
          /tmp/wheel/bin/python - <<'PY'
          from importlib.util import find_spec
          present = [m for m in ("numpy", "xarray", "torch", "matplotlib", "streamlit") if find_spec(m)]
          assert not present, f"the base install unexpectedly has {present}"
          PY
      # exege, against the exege-core just built (it pins that exact version), must
      # bring every extra but nn.
      - name: Try the exege wheel
        run: |
          uv venv /tmp/full
          uv pip install --python /tmp/full/bin/python --find-links dist dist/exege-*.whl
          /tmp/full/bin/exege --version
          /tmp/full/bin/python - <<'PY'
          from importlib.util import find_spec
          wanted = ("numpy", "xarray", "matplotlib", "cartopy", "streamlit", "huggingface_hub")
          missing = [m for m in wanted if not find_spec(m)]
          assert not missing, f"the full install is missing {missing}"
          assert not find_spec("torch"), "torch is for exege[nn], not the default"
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          if-no-files-found: error

  testpypi:
    if: github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/project/exege-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true  # a rehearsal of a version already rehearsed is not a failure

  pypi:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/exege-core/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
