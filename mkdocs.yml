site_name: exege
site_description: Tools for understanding and evaluating scientific machine-learning models
site_url: https://mahf708.github.io/exege
edit_uri: edit/main/docs

theme:
  name: material
  features:
    # Navigation
    - navigation.sections
    - navigation.expand
    - navigation.indexes
    - navigation.tracking
    - navigation.instant
    - navigation.instant.progress
    - navigation.footer
    - navigation.top
    - toc.follow
    # Search
    - search.suggest
    - search.highlight
    - search.share
    # Content
    - content.code.copy
    - content.code.annotate
    - content.code.select
    - content.action.edit
    - content.action.view
    - content.tabs.link
    - content.tooltips
    # Header
    - header.autohide
    - announce.dismiss
  palette:
    - scheme: default
      primary: indigo
      accent: green
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: green
      toggle:
        icon: material/weather-night
        name: Switch to light mode
  font:
    text: Roboto
    code: Roboto Mono
  icon:
    repo: fontawesome/brands/github

# AGENTS.md files are contracts for contributors, not published pages.
exclude_docs: |
  AGENTS.md

plugins:
  - search
  - social:
      # Cards are drawn with cairo, a system library. CI has it; a laptop may not:
      #   MKDOCS_SOCIAL=false uv run --group docs mkdocs build --strict
      enabled: !ENV [MKDOCS_SOCIAL, true]

repo_url: https://github.com/mahf708/exege
repo_name: mahf708/exege

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/mahf708/exege
      name: exege on GitHub
  generator: false

markdown_extensions:
  # Admonitions
  - admonition
  - pymdownx.details
  # Code
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  # Formatting
  - pymdownx.critic:
      mode: accept
  - pymdownx.caret
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tilde
  # Tabs & Tasks
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  # Emoji & Icons
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  # HTML & Attributes
  - attr_list
  - md_in_html
  - def_list
  # Tables & Footnotes
  - tables
  - footnotes
  # Math
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Overview: index.md
  - Latent diagnostics: latents.md
  - Sparse autoencoders: nn.md
  - Evaluating a dictionary: evaluation.md
  - Steering: steering.md
  - Experiment records: records.md
  - Web app: app.md
