[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# The full install: no code of its own, only exege-core with every extra but nn.
# `import exege` and the `exege` command come from exege-core either way. The version
# and the pin below move together with `exege.__version__`; tests/test_packaging.py
# and the release workflow refuse any disagreement.
[project]
name = "exege"
version = "0.7.0"
description = "Tools for understanding and evaluating scientific machine-learning models: latent-space diagnostics, sparse autoencoders, figures, a local app"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "mahf708" }]
keywords = ["interpretability", "emulator", "climate", "e3sm", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]
dependencies = ["exege-core[app,hf]==0.7.0"]

[project.optional-dependencies]
# torch is left out of the default: its build (CPU, CUDA) is the machine's business.
nn = ["exege-core[nn]==0.7.0"]

[project.urls]
Homepage = "https://exege.readthedocs.io"
Documentation = "https://exege.readthedocs.io"
Source = "https://github.com/mahf708/exege"
Issues = "https://github.com/mahf708/exege/issues"

[tool.uv.sources]
exege-core = { workspace = true }

# Nothing to package but the metadata.
[tool.hatch.build.targets.wheel]
bypass-selection = true
