[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "exege-core"
dynamic = ["version"]
description = "Tools for understanding and evaluating scientific machine-learning models: the code, and only Click. `exege` is the full install."
# The repository's README is about the repository; this one is about the package, and is
# the page PyPI shows.
readme = "src/exege/README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "mahf708" }]
keywords = ["interpretability", "emulator", "climate", "e3sm", "machine-learning"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Atmospheric Science",
]

# Base tier stays deliberately tiny: see src/exege/AGENTS.md
dependencies = ["click>=8.1"]

# One extra per subpackage that needs more than the base tier, named after it, and
# no others: "to use exege.latents, install exege-core[latents]" is the whole rule.
# The `exege` distribution (packages/exege) is this with every extra but nn.
[project.optional-dependencies]
# xarray reads what the adapters read, and needs a backend to open NetCDF with;
# netCDF4 is the one the rest of the E3SM/ACE stack already uses.
latents = ["numpy>=1.24", "xarray>=2023.1", "netCDF4>=1.6"]
# cartopy is for coastlines; without its data (no network) maps are still drawn.
figures = ["matplotlib>=3.7", "cartopy>=0.23", "exege-core[latents]"]
app = ["streamlit>=1.50", "exege-core[figures]"]
# It trains on latents, so it brings that extra as figures does.
nn = ["torch>=2.0", "exege-core[latents]"]
# Reads a latent archive straight from a Hugging Face dataset repository (hf://datasets/...),
# a file at a time.
hf = ["huggingface_hub>=0.23", "exege-core[latents]"]

# What a checkout gets and a wheel does not. uv installs the `dev` and `full` groups by
# default, so `uv run exege ...`, `uv run pytest` and `uv run ruff check` work with no
# flags, while an installed exege-core stays on the base tier until an extra is asked for.
# `full` is every extra but torch, which is large and whose build (CPU, CUDA) is the
# machine's business: ask for it with `uv sync --extra nn`. The base tier alone:
#   uv sync --no-default-groups --group dev
# and the guide: `uv run --group docs sphinx-build -W docs docs/_build/html`.
[dependency-groups]
dev = ["pytest>=7.4", "ruff>=0.5"]
full = ["exege-core[app]", "exege-core[hf]"]
# The guide: Sphinx, Furo and MyST, built on Read the Docs (.readthedocs.yaml).
docs = [
    "sphinx>=8",
    "furo>=2024.8",
    "myst-parser>=4",
    "sphinx-click>=6",
    "sphinx-copybutton>=0.5",
]

[tool.uv]
default-groups = ["dev", "full"]

# packages/exege is the full install: no code, only this distribution and its extras.
[tool.uv.workspace]
members = ["packages/exege"]

[project.scripts]
exege = "exege._cli:main"

# The only way an adapter is found, shipped or third-party alike, so one can ship in a
# separate distribution without editing exege at all. After adding an entry here, run
# `uv sync` so the installed metadata is refreshed.
[project.entry-points."exege.adapters"]
latent-archive = "exege.adapters.latent_archive:LatentArchive"
bundle-dir = "exege.adapters.bundle_dir:BundleDir"
toy-dynamics = "exege.adapters.toy_dynamics:ToyDynamics"

[project.urls]
Homepage = "https://exege.readthedocs.io"
Documentation = "https://exege.readthedocs.io"
Source = "https://github.com/mahf708/exege"
Issues = "https://github.com/mahf708/exege/issues"

[tool.hatch.version]
path = "src/exege/__init__.py"

# A release holds the package, its tests and its licences: not the guide site, the run
# configs or the notes for contributors that share this repository with it.
[tool.hatch.build.targets.sdist]
include = ["src/exege", "tests", "LICENSE", "NOTICE", "pyproject.toml"]
exclude = ["AGENTS.md"]

[tool.hatch.build.targets.wheel]
packages = ["src/exege"]
exclude = ["AGENTS.md", "src/exege/README.md"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
# TID252 bans relative imports: the architecture tests read absolute ones.
select = ["E", "F", "I", "UP", "B", "SIM", "TID252"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
# A compiled wheel (netCDF4, cftime) built against older numpy headers says this on
# import. numpy silences it itself; pytest resets the filters, so it is restated here.
filterwarnings = ["ignore:numpy.ndarray size changed:RuntimeWarning"]
